# Installer per Windows, macOS (Apple Silicon e Intel) e Linux.
# - A ogni modifica su main: gli installer si scaricano dalla pagina
#   dell'esecuzione, nella sezione "Artifacts".
# - Con un tag che inizia per "v" (per esempio v0.2.0), anche creato dalla
#   pagina Release di GitHub: la release viene pubblicata con tutti gli
#   installer allegati, scaricabili da chiunque.
# Gli installer non sono ancora firmati: la firma arriverà più avanti.
name: Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  # Anche quando la release si crea dalla pagina di GitHub (Draft a new release).
  release:
    types: [published]
  workflow_dispatch:

# Una sola esecuzione per ramo o versione: quella nuova sostituisce quella in corso.
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ''
          - platform: macos-latest
            name: macos-apple-silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            name: macos-intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            name: linux
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Librerie di sistema per Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'Better-Look ${{ github.ref_name }}'
          releaseBody: |
            Versione di anteprima di Better-Look. Scarica qui sotto, in **Assets**, il file del tuo sistema:
            - **Windows:** il file che finisce con `_x64-setup.exe`;
            - **Mac con chip Apple** (M1 e successivi): il file che finisce con `_aarch64.dmg`; **Mac con Intel:** quello che finisce con `_x64.dmg`;
            - **Linux:** `.deb`, `.rpm` o `.AppImage`.

            Gli installer non sono ancora firmati: al primo avvio Windows e macOS mostrano un avviso di sicurezza. Come procedere è spiegato nel README, alla voce "Scaricare e provare".
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: better-look-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
