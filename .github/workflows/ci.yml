# Controlli a ogni modifica: tipi, test della logica, build dell'interfaccia,
# test del motore Rust e collaudo completo contro un server di posta di prova
# (Dovecot + SMTP) avviato sulla macchina di GitHub.
name: Controlli

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Librerie di sistema per Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Test del motore
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Server di posta di prova
        run: |
          sudo apt-get install -y dovecot-imapd dovecot-pop3d dovecot-lmtpd
          sudo pip install aiosmtpd || sudo pip install --break-system-packages aiosmtpd
          sudo tools/posta-di-prova/avvia.sh

      - name: Collaudo IMAP, SMTP e POP3
        env:
          BETTERLOOK_SERVER_PROVA: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --test server_prova -- --test-threads=1
