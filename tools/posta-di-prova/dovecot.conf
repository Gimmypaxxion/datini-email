# Configurazione di Dovecot per il server di prova (vedi avvia.sh).
protocols = imap pop3 lmtp
listen = 127.0.0.1
base_dir = @RUN@
state_dir = /var/lib/dovecot-prova
log_path = /var/log/dovecot-prova.log

ssl = yes
ssl_cert = <@CONF@/server.crt
ssl_key = <@CONF@/server.key
disable_plaintext_auth = yes
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u @CONF@/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=@DATI@/%d/%n
}

mail_location = maildir:~/Maildir
mail_privileged_group = vmail

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service lmtp {
  inet_listener lmtp {
    address = 127.0.0.1
    port = 24
  }
}
protocol pop3 {
  pop3_uidl_format = %08Xu%08Xv
}
