[package]
name = "datini"
version = "0.1.0"
description = "Client di posta desktop libero e open source"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Il nome con suffisso evita conflitti con il binario su Windows.
name = "datini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Motore di posta
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
futures = "0.3"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
mail-parser = "0.11"
ammonia = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "charset"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["system-config", "tokio"] }
roxmltree = "0.20"
outlook-pst = "1.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
base64 = "0.22"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
