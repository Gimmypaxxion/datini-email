[package]
name = "datini"
version = "0.1.0"
description = "Client di posta desktop libero e open source"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Il nome con suffisso evita conflitti con il binario su Windows.
name = "datini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
